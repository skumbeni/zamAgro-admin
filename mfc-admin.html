<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Food Connect · Admin</title>
<style>
:root{--bg:#f5f6f2;--ink:#18251f;--muted:#68746d;--line:#e1e7df;--brand:#176b45;--brand2:#e7f3eb;--danger:#b9382c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:17px;margin:0}main{max-width:900px;margin:auto;padding:16px 18px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit}input,select{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fbfcfa;min-width:0;color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pri{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}.del{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.muted{color:var(--muted);font-size:12px}
.tabs{margin-bottom:14px}.tabs button{border-radius:999px}.tabs .on{background:var(--brand2);color:var(--brand);border-color:#cfe3d5;font-weight:700}
.item{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.off{opacity:.55}.hidden{display:none!important}#login{max-width:340px;margin:60px auto}#login input{width:100%;margin-bottom:10px}
.err{color:var(--danger);font-size:13px;margin:8px 0 0}pre{white-space:pre-wrap;margin:6px 0;font:inherit}
.chip{border-radius:999px}.chip.on{background:var(--brand2);color:var(--brand);border-color:#cfe3d5;font-weight:700}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:#fff3cd;color:#72501d;margin:4px 4px 0 0}.badge.ok{background:var(--brand2);color:var(--brand)}
.logo{width:36px;height:36px;border-radius:9px;object-fit:contain;background:#fff;border:1px solid var(--line);vertical-align:middle;margin-right:4px}
.ov{position:fixed;inset:0;background:rgba(24,37,31,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.ovbox{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px}
.ovbox textarea{width:100%;flex:1 0 160px;resize:none;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fbfcfa;color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.ovbox textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.ovbox.big{height:92vh;height:92dvh}
#impRev{flex:1 1 0;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:9px;background:#fbfcfa;padding:0 10px 8px}
.rv{border-top:1px solid var(--line);padding:8px 0}#impRev datalist+.rv{border-top:0}
.rvt{display:flex;gap:6px;align-items:center;margin-bottom:6px}.rvt input{min-width:0;font-size:15px}
.rvt input[type=checkbox]{flex:none;width:22px;height:22px;padding:0}
.rvn,.rvd{flex:1}.rvp{width:84px;flex:none}.rvc{flex:0 0 38%}
.rv.off{opacity:.5}.rv.bad{border-left:3px solid var(--danger);padding-left:8px}
.rvf{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.rvf .badge{margin:0}
.impai{border:1px dashed var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fl{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;border-top:1px solid var(--line);padding-top:6px}.fl>span{min-width:0;overflow-wrap:anywhere}.fl button{padding:2px 8px;flex:none}
#impFl:empty,#impMsg:empty{display:none}
.badge.ai{border:1px solid #cdd8f2;background:#e8eefb;color:#2a4a8a;cursor:pointer;font:inherit;font-size:11px;font-weight:700;line-height:1.4}
.warnbox{background:#fff7e9;border:1px solid #f3dfb9;color:#72501d;border-radius:9px;padding:8px 10px;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<header><h1>Food Connect · Admin</h1><button id="out" class="hidden">Sign out</button></header>
<main>
  <div id="login" class="card">
    <strong>Admin sign in</strong>
    <div style="margin-top:12px"><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="pass" type="password" autocomplete="current-password" placeholder="Password"></div>
    <button id="loginBtn" class="pri" style="width:100%">Sign in</button>
    <p id="err" class="err"></p>
  </div>
  <div id="app" class="hidden">
    <div class="tabs row"><button id="t-orders" class="on" onclick="setTab('orders')">Orders</button><button id="t-suppliers" onclick="setTab('suppliers')">Suppliers and menus</button><button id="t-towns" onclick="setTab('towns')">Towns</button><button id="t-pay" onclick="setTab('pay')">Payments</button><button id="t-customers" onclick="setTab('customers')">Customers</button><button id="t-prices" onclick="setTab('prices')">Prices</button><button id="t-manual" onclick="setTab('manual')">Add order</button></div>
    <div id="body"></div>
  </div>
</main>
<div id="impBox" class="ov hidden" role="dialog" aria-modal="true" aria-labelledby="impTitle" onclick="if(event.target===this&&imp.mode!=='review'&&!imp.files.length)closeImport()">
  <div class="ovbox" id="impDlg">
    <div class="row sp"><strong id="impTitle">Import menu</strong><button onclick="askCloseImport()" aria-label="Close">✕</button></div>
    <div class="muted" id="impFor"></div>
    <textarea id="impText" oninput="impInput()" aria-label="Menu text" spellcheck="false"></textarea>
    <div class="muted" id="impCount"></div>
    <div class="impai" id="impAI">
      <div class="muted">Or let AI read a menu photo, PDF or Word file. It also reads any text pasted above. You check every item before anything is saved.</div>
      <button id="impResume" type="button" class="hidden" onclick="impResume()">← Back to the list I just read</button>
      <div class="row"><button id="impAdd" type="button" onclick="$('impFile').click()">📷 Add photo, PDF or Word file</button><button id="impRead" type="button" class="pri" onclick="impReadAI()" disabled>Read with AI</button></div>
      <input id="impFile" type="file" class="hidden" multiple accept="image/*,application/pdf,.pdf,.docx,.doc,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onchange="impFiles(this)" aria-label="Menu photos, PDF or Word files">
      <div id="impFl"></div>
      <div class="muted" id="impMsg" role="status"></div>
    </div>
    <div class="row sp hidden" id="impBar"><span class="muted" id="impSum"></span><button class="chip" id="impOnly" onclick="rvOnly()">Flagged only</button></div>
    <div id="impRev" class="hidden"></div>
    <div class="row sp" id="impBtnsText"><button onclick="askCloseImport()">Cancel</button><button class="pri" onclick="importNext()">Review items</button></div>
    <div class="row sp hidden" id="impBtnsRev"><button onclick="importMode('text')">← Edit text</button><button class="pri" id="impPub" onclick="importPublish()">Publish</button></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// Firebase web app config (public identifiers; access is controlled by the database rules)
const FIREBASE_CONFIG={apiKey:"AIzaSyCwCTU875jLcFYba0-fVO5aVQPMsYFClzY",authDomain:"food-connect-7625e.firebaseapp.com",databaseURL:"https://food-connect-7625e-default-rtdb.firebaseio.com",projectId:"food-connect-7625e",appId:"1:328514573103:web:6dfda1f65c6bb390e487da"};
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.database(),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const K=n=>"K"+(Number(n)||0).toFixed(2);
const STATUSES=["new","confirmed","paid","purchased","delivering","delivered","cancelled"];
let users={},blocked={},cfilter="all",suppliers={},orders={},towns={},tab="orders",open=null,subs=[],ofilter="all",formKeep={};

const show=on=>{$("login").classList.toggle("hidden",on);$("app").classList.toggle("hidden",!on);$("out").classList.toggle("hidden",!on)};
$("loginBtn").onclick=()=>{$("err").textContent="";auth.signInWithEmailAndPassword($("email").value.trim(),$("pass").value).catch(e=>$("err").textContent="Sign-in failed ("+e.code+"). Check your email and password.")};
$("pass").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click()};
$("out").onclick=()=>auth.signOut();

auth.onAuthStateChanged(async u=>{
  subs.forEach(r=>r.off());subs=[];
  if(!u){imp.drafts={};closeImport();show(false);return}
  let ok=false;
  try{ok=(await db.ref("admins/"+u.uid).get()).val()===true}catch(e){}
  if(!ok){$("err").textContent="This account is not an admin yet. Add this UID under admins in the database: "+u.uid;await auth.signOut();return}
  show(true);
  const s=db.ref("suppliers"),o=db.ref("orders").orderByChild("createdAt").limitToLast(100),t=db.ref("towns"),pr=db.ref("settings/pricing"),us=db.ref("users"),bl=db.ref("blocked");
  s.on("value",x=>{suppliers=x.val()||{};if(tab==="suppliers"||tab==="towns"||tab==="manual")render()},fail);
  pr.on("value",x=>{const p=x.val();if(p){const n=(v,d)=>isFinite(Number(v))&&v!==null&&v!==""?Number(v):d;FEE.pct=n(p.servicePct,FEE.pct);FEE.min=n(p.serviceMin,FEE.min);FEE.minFood=n(p.minFood,FEE.minFood);FEE.zones=[n(p.d1,FEE.zones[0]),n(p.d2,FEE.zones[1]),n(p.d3,FEE.zones[2])];FEE.updatedAt=Number(p.updatedAt)||0}if(tab==="prices"||tab==="manual")render()},fail);
  us.on("value",x=>{users=x.val()||{};if(tab==="customers")render()},fail);
  bl.on("value",x=>{blocked=x.val()||{};if(tab==="customers")render()},fail);
  t.on("value",x=>{towns=x.val()||{};if(tab==="suppliers"||tab==="towns"||tab==="manual")render()},fail);
  o.on("value",x=>{orders=x.val()||{};if(tab==="orders"||tab==="pay")render()},fail);
  subs=[s,o,t,pr,us,bl];render();
});

function setTab(t){tab=t;["orders","suppliers","towns","pay","customers","prices","manual"].forEach(x=>$("t-"+x).classList.toggle("on",x===t));render()}
// Redraws the tab but keeps anything being typed, so a live update never wipes a half-filled form.
function render(){
  const b=$("body"),ae=document.activeElement;
  formKeep={};b.querySelectorAll("input[id],select[id],textarea[id]").forEach(e=>{formKeep[e.id]=e.value});
  const fid=ae&&ae.id&&b.contains(ae)?ae.id:"",pos=fid&&ae.selectionStart!=null?ae.selectionStart:null;
  b.innerHTML=tab==="orders"?renderOrders():tab==="suppliers"?renderSuppliers():tab==="towns"?renderTowns():tab==="pay"?renderPayments():tab==="prices"?renderPrices():tab==="customers"?renderCustomers():renderManual();
  Object.keys(formKeep).forEach(id=>{const e=$(id);if(!e)return;if(e.tagName==="SELECT"){if(Array.from(e.options).some(o=>o.value===formKeep[id]))e.value=formKeep[id]}else e.value=formKeep[id]});
  if(fid&&$(fid)){$(fid).focus();try{if(pos!=null)$(fid).setSelectionRange(pos,pos)}catch(e){}}
  if(tab==="manual")mCalc();
}
const clr=ids=>ids.forEach(i=>{const e=$(i);if(e)e.value=""});
const fail=e=>alert("Not saved: "+e.message);
const upd=(p,v)=>db.ref(p).update(v).catch(fail);
const rm=(p,m)=>confirm(m)&&db.ref(p).remove().catch(fail);
const delOrder=k=>rm('orders/'+k,'Delete order '+k+'?');
const ask=(m,v)=>{const r=prompt(m,v==null?"":v);return r===null?(v==null?"":String(v)):r.trim()};
const waDigits=v=>String(v||"").replace(/\D/g,"").replace(/^0/,"260");
// A supplier belongs to a town by townId; older suppliers are matched by their saved area name.
const townOf=s=>s.townId&&towns[s.townId]?s.townId:(Object.keys(towns).find(k=>String(towns[k].name).toLowerCase()===String(s.area||"").trim().toLowerCase())||"");

const FEE={pct:10,min:10,minFood:50,zones:[20,30,45],updatedAt:0};
const GROUPS={new:["new"],active:["confirmed","paid","purchased","delivering"],done:["delivered","cancelled"]};
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-(Number(t)||0))/60000));return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
function setFilter(f){ofilter=f;render()}
// Re-prices an order from its saved lines against the live menu and fee rules. null = older order with no saved lines.
function checkOrder(o){
  if(!Array.isArray(o.lines)||!o.lines.length)return null;
  const msgs=[],sup=suppliers[o.restaurantId];let sum=0;
  o.lines.forEach(l=>{
    const q=Number(l.qty)||0,p=Number(l.price)||0;sum+=q*p;
    if(sup&&sup.items){
      const cur=sup.items[l.id];
      if(!cur)msgs.push(esc(l.name)+" is no longer on the menu");
      else if(Number(cur.price)!==p)msgs.push(esc(l.name)+": ordered at "+K(p)+", menu now "+K(cur.price));
    }
  });
  const food=Number(o.food),service=Number(o.service),delivery=Number(o.delivery),total=Number(o.total);
  if(Math.abs(sum-food)>0.01)msgs.push("Items add up to "+K(sum)+" but the food total says "+K(food));
  if(Number(o.createdAt)>=FEE.updatedAt){
    const fee=Math.max(FEE.min,sum*FEE.pct/100);
    if(Math.abs(service-fee)>0.01)msgs.push("Service fee is "+K(service)+", it should be "+K(fee));
    if(FEE.zones.indexOf(delivery)<0)msgs.push("Delivery fee "+K(delivery)+" is not one of the standard fees");
  }
  if(Math.abs(total-(food+service+delivery))>0.01)msgs.push("Total "+K(total)+" does not equal food + service + delivery");
  return msgs;
}
function orderCard(o){
  const p=waDigits(o.phone);
  const hi="Hi "+(o.customer||"")+", this is Food Connect about your order "+o.ref+" ("+(o.restaurant||"")+", "+K(o.total)+")."+(o.status==="new"?" Please confirm you would like to go ahead.":"");
  const chk=checkOrder(o);
  const badges=(o.status==="new"?`<span class="badge">⏳ New · ${esc(ago(o.createdAt))} · look for ${esc(o.ref)} in WhatsApp</span>`:"")+(o.source==="manual"?'<span class="badge ok">Added manually</span>':"");
  const verdict=chk===null?"":chk.length?`<div class="warnbox">⚠ Check before taking payment or buying:<br>${chk.map(m=>"• "+m).join("<br>")}</div>`:'<div><span class="badge ok">✓ Totals match items and current menu</span></div>';
  return `<div class="card"><div class="row sp"><strong>${esc(o.ref)} · ${esc(o.restaurant)}</strong><strong>${K(o.total)}</strong></div>
<div class="muted">${new Date(o.createdAt).toLocaleString()} · ${o.town?esc(o.town)+" · ":""}${esc(o.payment)} · food ${K(o.food)}, service ${K(o.service)}, delivery ${K(o.delivery)}</div>
<div>${badges}</div>
${o.paidAt?`<div class="muted">Paid ${esc(new Date(o.paidAt).toLocaleString())}${o.txn?" · Txn "+esc(o.txn):""}</div>`:(o.txn?`<div><span class="badge">💳 Customer txn ${esc(o.txn)} · check it in your mobile money, then mark paid</span></div>`:"")}
${o.txn&&Object.entries(orders).some(([k,x])=>k!==o.key&&x.txn===o.txn)?`<div class="warnbox">⚠ This transaction ID is also on another order.</div>`:""}
<pre>${esc((o.items||[]).join("\n"))}</pre>
<div>${esc(o.customer)} · ${esc(o.phone)}<br>${esc(o.address)}${o.notes?"<br><em>"+esc(o.notes)+"</em>":""}</div>
${verdict}
<div class="row" style="margin-top:10px"><select aria-label="Order status" data-k="${esc(o.key)}" onchange="setStatus(this.dataset.k,this.value)">${STATUSES.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select>
<a href="${esc("https://wa.me/"+p+"?text="+encodeURIComponent(hi))}" target="_blank" rel="noopener"><button>Message customer</button></a>
<button class="del" data-k="${esc(o.key)}" onclick="delOrder(this.dataset.k)">Delete</button></div></div>`;
}
function renderOrders(){
  const all=Object.entries(orders).map(([k,o])=>({...o,key:k})).sort((a,b)=>b.createdAt-a.createdAt);
  if(!all.length)return'<div class="card muted">No orders yet. Orders appear here when a customer taps Continue on WhatsApp, or when you add one in the Add order tab.</div>';
  const inG=(o,g)=>g==="all"||GROUPS[g].includes(o.status);
  const chip=(g,l)=>`<button class="chip ${ofilter===g?"on":""}" onclick="setFilter('${g}')">${l} (${all.filter(o=>inG(o,g)).length})</button>`;
  const list=all.filter(o=>inG(o,ofilter));
  return `<div class="row" style="margin-bottom:12px">${chip("all","All")}${chip("new","New, not yet handled")}${chip("active","In progress")}${chip("done","Finished")}</div>`
    +(list.map(orderCard).join("")||'<div class="card muted">No orders in this view.</div>');
}

const PAID_SET=["paid","purchased","delivering","delivered"];let pfilter="all";
function setPFilter(f){pfilter=f;render()}
// Marking an order paid records when, and (optionally) the mobile money transaction ID.
function setStatus(k,s){
  const v={status:s};
  if(s==="paid"){
    const cur=(orders[k]&&orders[k].txn)||"";
    const t=prompt("Mobile money transaction ID (the customer's is filled in; check it first):",cur);
    if(t===null){render();return}
    const id=t.trim().slice(0,40);
    if(id&&Object.entries(orders).some(([ok,o])=>ok!==k&&o.txn===id)&&!confirm("This transaction ID is already on another order. Save it anyway?")){render();return}
    v.paidAt=firebase.database.ServerValue.TIMESTAMP;if(id)v.txn=id;
  }
  upd("orders/"+k,v);
}
function renderPayments(){
  const now=Date.now(),when=o=>Number(o.paidAt||o.createdAt)||0;
  const inR=o=>pfilter==="all"||(pfilter==="today"?new Date(when(o)).toDateString()===new Date().toDateString():now-when(o)<=7*864e5);
  const list=Object.entries(orders).map(([k,o])=>({...o,key:k})).filter(o=>PAID_SET.includes(o.status)&&inR(o)).sort((a,b)=>when(b)-when(a));
  const sum=f=>list.reduce((a,o)=>a+Number(o[f]||0),0),byM={};list.forEach(o=>{byM[o.payment]=(byM[o.payment]||0)+Number(o.total||0)});
  const chip=(g,l)=>`<button class="chip ${pfilter===g?"on":""}" onclick="setPFilter('${g}')">${l}</button>`;
  return `<div class="row" style="margin-bottom:12px">${chip("today","Today")}${chip("week","Last 7 days")}${chip("all","All")}</div>
<div class="card"><div class="row sp"><strong>Collected (${list.length} orders)</strong><strong>${K(sum("total"))}</strong></div>
<div class="row sp muted"><span>Your fees (service + delivery)</span><span>${K(sum("service")+sum("delivery"))}</span></div>
<div class="row sp muted"><span>Food to pay restaurants</span><span>${K(sum("food"))}</span></div>
${Object.keys(byM).map(m=>`<div class="row sp muted"><span>${esc(m)}</span><span>${K(byM[m])}</span></div>`).join("")}</div>`
  +(list.map(o=>`<div class="card"><div class="row sp"><strong>${esc(o.ref)} · ${esc(o.restaurant)}</strong><strong>${K(o.total)}</strong></div><div class="muted">${esc(new Date(when(o)).toLocaleString())} · ${esc(o.payment)}${o.txn?" · Txn "+esc(o.txn):""} · ${esc(o.customer)}</div></div>`).join("")||'<div class="card muted">No payments in this period.</div>');
}

/* ---------- Customers (find, block and clean up accounts) ---------- */
const PHONE_DOMAIN="phone.nexlitedigitalsolutionslimited.digital",AUTH_URL="https://console.firebase.google.com/project/food-connect-7625e/authentication/users";
function setCFilter(f){cfilter=f;render()}
function custList(){
  const phoneCount={},ordN={};
  Object.values(users).forEach(u=>{const d=waDigits(u&&u.phone);if(d)phoneCount[d]=(phoneCount[d]||0)+1});
  Object.values(orders).forEach(o=>{if(o.uid)ordN[o.uid]=(ordN[o.uid]||0)+1});
  return Object.entries(users).map(([uid,u])=>{u=u||{};const d=waDigits(u.phone),issues=[];
    if(!u.phone)issues.push("No phone saved");else if(phoneCount[d]>1)issues.push("Same phone as another account");
    if(!u.email)issues.push("No sign-in email recorded");
    return {uid,...u,orders:ordN[uid]||0,isBlocked:!!blocked[uid],issues};
  }).sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));
}
function renderCustomers(){
  const all=custList(),q=($("cq")?$("cq").value:(formKeep.cq||"")).trim().toLowerCase();
  const inF=c=>cfilter==="all"||(cfilter==="blocked"?c.isBlocked:c.issues.length>0);
  const hit=c=>!q||[c.name,c.phone,c.email,c.uid].some(x=>String(x||"").toLowerCase().includes(q));
  const chip=(g,l,n)=>`<button class="chip ${cfilter===g?"on":""}" onclick="setCFilter('${g}')">${l} (${n})</button>`;
  const list=all.filter(c=>inF(c)&&hit(c));
  const rows=list.map(c=>`<div class="card"><div class="row sp"><strong>${esc(c.name||"No name")} · ${esc(c.phone||"no phone")}</strong><span class="muted">${c.orders} recent order${c.orders===1?"":"s"}</span></div>
<div class="muted">${c.createdAt?"Joined "+esc(new Date(c.createdAt).toLocaleDateString())+" · ":""}Sign-in: ${esc(c.email||"unknown")}</div>

function parseCoords(lat,lng,rad){

  return {lat:a,lng:b,radius:Number(rad)>0?Number(rad):40};
}

/* ---------- Read a menu from photos, PDFs and Word files (calls the menu reader Worker, see MENU_AI_URL) ---------- */
const IMG_MAX=1600,IMP_MAX_FILES=8,PDF_MAX=10*1024*1024,B64_TOTAL=19e6; // photo long edge in px; files per read; PDF bytes; all base64 together (the Worker allows about 20 MB)
const MAMMOTH_URL="https://cdn.jsdelivr.net/npm/mammoth@1.12.3/mammoth.browser.min.js"; // loaded only when a Word file is picked
const bad=m=>Object.assign(new Error(m),{user:true}); // an error whose text is fit to show the admin
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
function impSay(m,isBad){const e=$("impMsg");e.textContent=m||"";e.style.color=isBad?"var(--danger)":""}
function impKind(f){ // "pdf", "docx", "doc", "image", or "" when it is none of those
  const n=String(f.name||"").toLowerCase(),t=String(f.type||"").toLowerCase();
  if(t==="application/pdf"||/\.pdf$/.test(n))return "pdf";
  if(/\.docx$/.test(n)||t==="application/vnd.openxmlformats-officedocument.wordprocessingml.document")return "docx";
  if(/\.doc$/.test(n)||t==="application/msword")return "doc";
  if(t.indexOf("image/")===0||/\.(jpe?g|png|webp|gif|heic|heif)$/.test(n))return "image";
  return "";
}
const impB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=()=>no(r.error);r.readAsDataURL(f)});
// Photos are shrunk to IMG_MAX on the long edge and saved as JPEG: a phone photo of several MB becomes a few hundred KB.
async function impShrink(f){
  const url=URL.createObjectURL(f);
  try{
    const img=new Image();img.src=url;
    try{await img.decode()}catch(_){throw bad("could not be opened. If it is an iPhone HEIC photo, take it as JPEG or send a screenshot")}
    const w0=img.naturalWidth,h0=img.naturalHeight;if(!w0||!h0)throw bad("could not be opened");
    const k=Math.min(1,IMG_MAX/Math.max(w0,h0)),w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k)); // never enlarge a small photo
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h); // white behind transparent PNGs
    return {data:c.toDataURL("image/jpeg",0.85).split(",")[1],w,h};
  }finally{URL.revokeObjectURL(url)}
}
let mammothLoad=null;
function loadMammoth(){
  if(window.mammoth)return Promise.resolve();
  return mammothLoad||(mammothLoad=new Promise((ok,no)=>{
    const s=document.createElement("script");s.src=MAMMOTH_URL;s.crossOrigin="anonymous";
    s.onload=()=>window.mammoth?ok():(mammothLoad=null,no(new Error("no global")));
    s.onerror=()=>{mammothLoad=null;s.remove();no(new Error("load"))};
    document.head.appendChild(s);
  }));
}
function impAiButtons(){
  $("impAdd").disabled=imp.aiBusy;
  $("impRead").disabled=imp.aiBusy||(!imp.files.length&&!$("impText").value.trim());
  $("impRead").textContent=imp.aiBusy?"Reading…":"Read with AI";
  $("impResume").classList.toggle("hidden",!(imp.src==="ai"&&imp.rows.length>0));
}
function impFilesRender(){
  $("impFl").innerHTML=imp.files.map((f,i)=>`<div class="fl"><span>${f.kind==="pdf"?"📄":"🖼️"} ${esc(f.name)} <span class="muted">${f.kind==="pdf"?kb(f.size):f.w+"×"+f.h+" · "+kb(f.size)}</span></span><button type="button" onclick="impDrop(${i})" aria-label="Remove ${esc(f.name)}">✕</button></div>`).join("");
  impAiButtons();
}
function impDrop(i){if(imp.aiBusy)return;imp.files.splice(i,1);impFilesRender();impSay("")}
async function impFiles(inp){
  const list=Array.from(inp.files||[]);inp.value=""; // so the same file can be picked again
  if(!imp.sid||imp.aiBusy||!list.length)return;
  const run=imp.run,problems=[];let added=0,texts=0;
  for(let i=0;i<list.length;i++){
    const f=list[i],kind=impKind(f),label=f.name||"file";
    impSay("Preparing "+(i+1)+" of "+list.length+": "+label+"…");
    try{
      if(kind==="doc")throw bad("is an old .doc file. Open it in Word and save it as .docx, or as a PDF");
      if(!kind)throw bad("is not a photo, PDF or Word file");
      if(kind==="docx"){
        try{await loadMammoth()}catch(_){throw bad("could not be read because the Word reader did not load. Check your connection, or save the file as a PDF")}
        const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});
        if(run!==imp.run)return;
        // mammoth puts a blank line after every paragraph; one newline per paragraph is closer to how a menu is typed
        const txt=String(r.value||"").replace(/\r/g,"").replace(/\n\n/g,"\n").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
        if(!txt)throw bad("has no text in it (maybe only pictures). Save its pages as photos or a PDF instead");
        const ta=$("impText");ta.value=(ta.value.trim()?ta.value.replace(/\s+$/,"")+"\n\n":"")+txt;impInput();texts++;
      }else{
        if(imp.files.length>=IMP_MAX_FILES)throw bad("was not added: the limit is "+IMP_MAX_FILES+" files at a time");
        let rec;
        if(kind==="pdf"){
          if(f.size>PDF_MAX)throw bad("is over 10 MB, which is too big. Send fewer pages");
          rec={kind,mediaType:"application/pdf",data:await impB64(f)}; // sent exactly as it is

      if(!/[A-Za-z]/.test(p.name)){
        const c=claim(pd);if(!c)return skip("a price with no item name"); // name (and maybe a description) on the lines above, price alone here
        prev=[add(ln,c.head.name,p.price,c.desc||"")];return;
      }
      let name=p.name,desc="";
      const d=name.match(/^(.{2,}?)\s+[-–—]\s+(.+)$/); // "Burger - beef, cheese, salad - 45": the middle part is the description
      if(d){name=d[1];desc=d[2]}
      prev=[add(ln,mpName(name),p.price,desc)];return;
    }
    // 4. No price. Right after an item it is usually that item's description ("Served with coleslaw.")
    if(prev&&(/[.;]$/.test(t)||/^(served|comes|with|includes|choice of|add)\b/i.test(t)||(t.split(" ").length>=3&&(/^[a-z(]/.test(t)||t.includes(","))))){
      prev.forEach(r=>{r.description=(r.description?r.description+" ":"")+t});return;
    }
    // 5. No price, contains a digit ("Fanta 500ml"): probably an item whose price is missing
    if(/\d/.test(t)&&t.length<=60){prev=[add(ln,mpName(t),null)];return}
    // 6. No price: a category heading
    if(t.length>40||/[.;]$/.test(t)||(t.includes(",")&&t.split(" ").length>=3)){
      skip(t.length>40?"no price and too long to be a heading":"looks like a sentence, not a heading");
      if(pd&&!pd.desc){pd.desc=t;pd.sk=skipped[skipped.length-1];pend=pd} // may turn out to be the description of the name line above
      return;
    }
    const h=mpCase(t.replace(/^[\s#*=_\-–—~:•·|]+|[\s#*=_\-–—~:•·|]+$/g,"")).slice(0,40).trim();
    if(!h){prev=null;return}
    const prevCat=cat,prevHead=head;
    cat=catSpelling[h.toLowerCase()]||(catSpelling[h.toLowerCase()]=h); // "burgers" and "BURGERS" share the first spelling
    head={name:cat,line:ln,count:0};heads.push(head);prev=null;
    pend={head,prevCat,prevHead,desc:null,sk:null};
  });
  heads.forEach(h=>{if(!h.count)warnings.push({line:h.line,text:h.name,msg:"heading with no items under it (is it an item missing a price?)"})});
  const fl=menuFlags(rows);rows.forEach((r,i)=>{r.flags=fl[i]});
  return {rows,skipped,warnings};
}
/* PARSER END */
function delSup(id){rm("suppliers/"+id,"Delete "+suppliers[id].name+" and its whole menu?")}
const catOf=i=>String((i&&i.category)||"").trim();
const lastCat={}; // last category typed per supplier, so a run of items in one category needs it only once
// Reuses the spelling of an existing category (so "burgers" and "Burgers" never become two groups).
function canonCat(sid,raw){
  const c=String(raw||"").trim().replace(/\s+/g," ").slice(0,40);
  if(!c)return "";
  const hit=Object.values((suppliers[sid]&&suppliers[sid].items)||{}).map(catOf).find(x=>x&&x.toLowerCase()===c.toLowerCase());
  return hit||c;
}
function addItem(sid){
  const name=$("in_"+sid).value.trim(),price=parseFloat($("ip_"+sid).value);
  if(!name||!(price>=0))return alert("Enter an item name and a price.");
  const rec={name,description:$("id_"+sid).value.trim(),price,available:true},cat=canonCat(sid,$("ic_"+sid).value);
  if(cat)rec.category=cat;
  lastCat[sid]=cat;
  db.ref(`suppliers/${sid}/items`).push(rec).then(()=>clr(["in_"+sid,"id_"+sid,"ip_"+sid])).catch(fail);
}
function editItem(sid,k){
  const i=suppliers[sid].items[k],name=ask("Item name:",i.name),price=parseFloat(ask("Price (K):",i.price));
  if(!name||!(price>=0))return alert("Enter an item name and a valid price.");
  const description=ask("Description:",i.description),cat=canonCat(sid,ask("Category (leave empty for none):",catOf(i)));
  upd(`suppliers/${sid}/items/${k}`,{name,description,price,category:cat||null});
}
function setCat(sid,k){
  const i=suppliers[sid].items[k],cat=canonCat(sid,ask("Category (leave empty for none):",catOf(i)));
  upd(`suppliers/${sid}/items/${k}`,{category:cat||null});
}

/* ---------- Add order (for orders that reached you only on WhatsApp) ---------- */
function mSel(get){
  const act=Object.entries(towns).filter(([,t])=>t.active!==false);
  const tid=(get("mt")&&towns[get("mt")])?get("mt"):(act[0]?act[0][0]:"");
  const rs=Object.entries(suppliers).filter(([,s])=>s.active!==false&&townOf(s)===tid);
  const rid=rs.some(([id])=>id===get("mr"))?get("mr"):(rs[0]?rs[0][0]:"");
  return {act,tid,rs,rid};
}
function renderManual(){
  const {act,tid,rs,rid}=mSel(id=>formKeep[id]);
  if(!act.length)return'<div class="card muted">Add a town and a supplier first, then you can record orders here.</div>';
  const tOpts=act.map(([id,t])=>`<option value="${esc(id)}" ${id===tid?"selected":""}>${esc(t.name)}</option>`).join("");
  const rOpts=rs.map(([id,s])=>`<option value="${esc(id)}" ${id===rid?"selected":""}>${esc((s.icon||"🏪")+" "+s.name)}</option>`).join("");
  const s=suppliers[rid],items=s?Object.entries(s.items||{}).filter(([,i])=>i.available!==false):[];
  const rows=items.length?items.map(([k,i])=>`<div class="item"><span>${esc(i.name)} <span class="muted">${K(i.price)}</span></span><input id="mq_${esc(k)}" type="number" min="0" step="1" inputmode="numeric" placeholder="0" style="width:80px" oninput="mCalc()" aria-label="Quantity of ${esc(i.name)}"></div>`).join("")
    :'<div class="muted" style="padding:8px 0">'+(rid?"This restaurant has no available menu items.":"No active restaurants in this town yet.")+'</div>';
  const zl=["0–3 km","3–6 km","6–10 km"];
  return `<div class="card"><strong>Add an order that came in on WhatsApp</strong>
<div class="muted" style="margin:4px 0 10px">Use this for landing-page or direct WhatsApp orders, so they are recorded, priced and checked like shop orders. Saved as Confirmed.</div>
<div class="row"><select id="mt" aria-label="Town" onchange="render()">${tOpts}</select><select id="mr" aria-label="Restaurant" onchange="render()">${rOpts}</select></div>
<div style="margin-top:8px">${rows}</div>
<div class="row" style="margin-top:8px"><select id="mz" aria-label="Delivery zone" onchange="mCalc()">${FEE.zones.map((f,i)=>`<option value="${i}">${zl[i]} · K${f}</option>`).join("")}</select></div>
<div class="row" style="margin-top:8px"><input id="mc" placeholder="Customer name" maxlength="80"><input id="mp" type="tel" placeholder="Phone / WhatsApp" maxlength="20"></div>
<div class="row" style="margin-top:8px"><input id="ma" placeholder="Delivery address and landmark" maxlength="250" style="flex:1;min-width:220px"></div>
<div class="row" style="margin-top:8px"><select id="mpay" aria-label="Payment method"><option>MTN Mobile Money</option><option>Airtel Money</option><option>Cash deposit / transfer (confirm)</option></select><input id="mn" placeholder="Notes (optional)" maxlength="400" style="flex:1;min-width:160px"></div>
<div id="mtot" class="muted" style="margin:10px 0"></div>
<button class="pri" onclick="saveManual()">Save order</button></div>`;
}
function mCalc(){
  const {rid}=mSel(id=>$(id)?$(id).value:""),s=suppliers[rid],lines=[];
  if(s)Object.entries(s.items||{}).forEach(([k,i])=>{const e=$("mq_"+k),q=e?Math.floor(Number(e.value)):0;if(q>0&&i.available!==false)lines.push({id:k,name:String(i.name||"Item"),qty:q,price:Number(i.price)||0})});
  const food=lines.reduce((a,l)=>a+l.qty*l.price,0),service=food?Math.max(FEE.min,food*FEE.pct/100):0;
  const delivery=food?FEE.zones[Number($("mz")?$("mz").value:0)||0]:0,total=food+service+delivery;
  const box=$("mtot");
  if(box)box.textContent=food?`Food ${K(food)} · service ${K(service)} · delivery ${K(delivery)} · total ${K(total)}`+(food<FEE.minFood?` · minimum food order is ${K(FEE.minFood)}`:""):"Enter quantities to see the total.";
  return {lines,food,service,delivery,total,rid};
}
function saveManual(){
  const c=mCalc(),g=id=>$(id)?$(id).value.trim():"";
  const tid=g("mt"),t=towns[tid],s=suppliers[c.rid];
  if(!t||!s)return alert("Choose a town and a restaurant.");
  if(!c.lines.length)return alert("Enter a quantity for at least one item.");
  if(c.food<FEE.minFood)return alert("The food total must be at least "+K(FEE.minFood)+".");
  const customer=g("mc"),phone=g("mp"),address=g("ma");
  if(!customer||!phone||!address)return alert("Enter the customer's name, phone number and delivery address.");
  if(!/^[0-9+\s()-]{7,20}$/.test(phone))return alert("Enter a valid phone number.");
  const ref="MFC-"+Date.now().toString().slice(-8)+Math.random().toString(36).slice(2,4).toUpperCase();
  const rec={ref,uid:auth.currentUser.uid,email:"manual entry",source:"manual",restaurantId:c.rid,town:t.name,townId:tid,restaurant:s.name,
    items:c.lines.map(l=>`${l.qty} x ${l.name} @ ${K(l.price)} = ${K(l.qty*l.price)}`),lines:c.lines,
    food:c.food,service:c.service,delivery:c.delivery,total:c.total,customer,phone,address,payment:g("mpay"),notes:g("mn"),status:"confirmed",createdAt:firebase.database.ServerValue.TIMESTAMP};
  db.ref("orders/"+ref).set(rec).then(()=>{
    clr(["mc","mp","ma","mn"]);document.querySelectorAll('[id^="mq_"]').forEach(e=>{e.value=""});
    ofilter="all";setTab("orders");
  }).catch(fail);
}
</script>
